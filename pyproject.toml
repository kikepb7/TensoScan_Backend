[project]
name = "tensoscan-api"
version = "0.2.0"
description = "TensoScan backend: authentication, measurements and assistant API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "pymongo>=4.13",
    "pyjwt>=2.9",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # Legacy PDF/HTML report; replaced by ReportLab in the measurements API v1 (spec B-002).
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
# On-server digit recognition. Only needed while the legacy /ocr routes exist (spec B-002 retires them).
legacy-ocr = [
    "tensorflow>=2.16",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "mongomock-motor>=0.0.34",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["specs", "ml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "T20", "PT"]
ignore = [
    "B008",    # Depends() in argument defaults is the FastAPI idiom
    "RUF012",  # mutable class attributes on pydantic/settings models
    "N818",    # domain errors are named after the situation (NotFound, Unauthorized), not "...Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT018", "SIM117"]
"app/infrastructure/legacy_*/**" = ["T20", "S", "E501", "N", "SIM", "B", "RUF", "UP", "A"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.infrastructure.legacy_ocr.*", "app.infrastructure.legacy_reports.*", "app.api.legacy.ocr_legacy"]
ignore_errors = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["pwdlib.*", "xhtml2pdf.*", "mongomock_motor.*", "cv2.*", "tensorflow.*", "keras.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:mongomock",
]
markers = [
    "mongo: needs a real MongoDB (set TENSOSCAN_TEST_MONGODB_URL); in CI it runs against a service container",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/legacy_ocr/*", "app/infrastructure/legacy_reports/*", "app/api/legacy/ocr_legacy.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
