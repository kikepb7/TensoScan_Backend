[project]
name = "tensoscan-ml"
version = "0.1.0"
description = "TensoScan digit-detector tooling: synthetic data, ingestion, training, evaluation and LiteRT export (spec B-003)"
readme = "README.md"
requires-python = ">=3.12"
# Light core: enough for the parser, the synthetic generator, ingestion, the evaluation harness and the fast tests.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Training and checkpoint evaluation (PyTorch only; CUDA wheels from PyPI work on Colab/Kaggle, see README).
train = [
    "torch>=2.4",
]
# Checkpoint -> ONNX -> TFLite conversion (ADR-B003-07). Everything here is Apache-2.0/MIT/BSD.
export = [
    "torch>=2.4",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnx2tf>=1.26",
    "tensorflow>=2.16",
    "tf-keras>=2.16",
    "onnx-graphsurgeon>=0.5",
    "sne4onnx>=1.0",
    "sng4onnx>=1.0",
    "onnxsim>=0.4",
    "psutil>=5",
    "ai-edge-litert>=1.0",
]
# Running a .tflite on CPU (verify, eval --detector tflite, prelabel).
runtime = [
    "ai-edge-litert>=1.0",
]

[project.scripts]
tensoscan-ml = "tensoscan_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tensoscan_ml"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "T20", "PT", "NPY", "PIE", "RET", "TID"]
ignore = [
    "RUF001",  # Spanish text in docstrings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PT011", "PT018", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["tensoscan_ml"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tensoscan_ml"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "tensorflow.*",
    "tf_keras.*",
    "onnx2tf.*",
    "onnxsim.*",
    "onnxruntime.*",
    "onnxscript.*",
    "onnx_graphsurgeon.*",
    "ai_edge_litert.*",
    "flatbuffers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "torch: needs the `train` extra (PyTorch); skipped when it is not installed",
    "export: needs the `export` extra (ONNX, onnx2tf, TensorFlow, LiteRT); slow, skipped when it is not installed",
    "runtime: needs the `runtime` extra (LiteRT interpreter); skipped when it is not installed",
]
